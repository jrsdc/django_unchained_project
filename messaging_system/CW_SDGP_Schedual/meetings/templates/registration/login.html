<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login – Sky</title>
<style>
  :root { --sky-purple: #9d4edd; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f8f9fc, #fdf2ff); }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 8px 40px rgba(157,78,221,.12); padding: 44px 40px; width: 380px; }
  .logo-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; justify-content: center; }
  .logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #9d4edd, #ff4d6d); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 24px; }
  .logo-text { font-size: 28px; font-weight: 800; color: var(--sky-purple); letter-spacing: -1px; }
  h2 { font-size: 20px; font-weight: 700; margin-bottom: 24px; text-align: center; }
  .fg { margin-bottom: 16px; }
  .fg label { display: block; font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .fg input { width: 100%; padding: 11px 14px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; transition: .2s; font-family: inherit; }
  .fg input:focus { border-color: var(--sky-purple); box-shadow: 0 0 0 3px rgba(157,78,221,.1); }
  .error { background: #fff0f0; border: 1px solid #f5c6c5; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; color: #d9534f; }
  .btn { width: 100%; padding: 12px; background: var(--sky-purple); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 4px; }
  .btn:hover { background: #7b2fd4; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">S</div>
    <span class="logo-text">sky</span>
  </div>
  <h2>Welcome back 👋</h2>
  {% if form.errors %}
    <div class="error">Invalid username or password.</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="fg">
      <label>Username</label>
      <input type="text" name="username" autofocus required>
    </div>
    <div class="fg">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn">Log In</button>
  </form>
</div>
</body>
</html>
