<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <style>
        :root {
            --sky-purple: #9d4edd;
            --sky-pink: #ff4d9d;
            --sky-light-bg: #f8f9fc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            background-color: var(--sky-light-bg);
            color: #333;
        }

        .main-nav {
            width: 200px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 10px;
            flex-shrink: 0;
            min-height: 100vh;
            box-sizing: border-box;
            position: sticky;
            top: 0;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 10px;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #9d4edd, #ff4d6d);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 22px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: #9d4edd;
        }

        .main-nav-item {
            padding: 12px;
            text-decoration: none;
            color: #888;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            margin-bottom: 4px;
            border-radius: 8px;
        }

        .main-nav-item:hover,
        .main-nav-item.active {
            color: var(--sky-purple);
            background: #fdf2ff;
        }

        .nav-bottom {
            margin-top: auto;
            padding-top: 20px;
        }

        .nav-bottom form {
            margin: 0;
        }

        .logout-btn {
            width: 100%;
            border: none;
            background: transparent;
            text-align: left;
            cursor: pointer;
            padding: 12px;
            color: #d9534f;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            border-radius: 8px;
            font-family: inherit;
        }

        .logout-btn:hover {
            background: #fff1f1;
            color: #c9302c;
        }

        .page {
            flex: 1;
            padding: 35px;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .header p {
            color: #777;
            margin-top: 0;
        }

        .settings-card {
            background: white;
            border-radius: 16px;
            padding: 28px;
            margin-top: 25px;
            max-width: 700px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            border: 1px solid #eee;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: 700;
            font-size: 14px;
        }

input {
    width: 100%;
    padding: 9px 10px;
    margin-top: 5px;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 13px;
}

input:focus {
    outline: none;
    border: 1px solid #9d4edd;
    box-shadow: 0 0 0 3px rgba(157, 78, 221, 0.15);
}

        .btn {
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            background: linear-gradient(135deg, var(--sky-purple), var(--sky-pink));
            display: inline-block;
            margin-top: 20px;
            font-family: inherit;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            background: #f2e6ff;
            color: #7b2cbf;
            font-weight: 600;
        }

        .section-title {
            margin-top: 0;
        }

        .helptext {
            display: block;
            color: #777;
            font-size: 12px;
            margin-top: 5px;
        }

        ul.errorlist {
            color: #d9534f;
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <div class="main-nav">
        <div class="nav-top">
            <div class="logo-container">
                <div class="logo-icon">S</div>
                <span class="logo-text">sky</span>
            </div>

            <a href="/teams/dashboard/" class="main-nav-item">📊 Dashboard</a>
            <a href="/teams/" class="main-nav-item">👥 Teams</a>
            <a href="/organisation/" class="main-nav-item">🏬 Organisation</a>
            <a href="/inbox/" class="main-nav-item">💬 Messages</a>
            <a href="#" class="main-nav-item">📅 Schedule</a>
            <a href="/teams/settings/" class="main-nav-item active">⚙️ Settings</a>
        </div>

        <div class="nav-bottom">
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="logout-btn">🔓 Logout</button>
            </form>
        </div>
    </div>

    <div class="page">
        <div class="header">

            <p>Manage your account and password.</p>
        </div>

        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}

        <div class="settings-card">
            <h3 class="section-title">Profile Settings</h3>

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="form_type" value="profile">

                <label>Username</label>
                <input type="text" value="{{ request.user.username }}" readonly>

                <label>First Name</label>
                <input type="text" name="first_name" value="{{ request.user.first_name }}">

                <label>Last Name</label>
                <input type="text" name="last_name" value="{{ request.user.last_name }}">

                <label>Email</label>
                <input type="email" name="email" value="{{ request.user.email }}">

                <button type="submit" class="btn">Save Profile</button>
            </form>
        </div>

        <div class="settings-card">
            <h3 class="section-title">Change Password</h3>

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="form_type" value="password">

                {{ password_form.as_p }}

                <button type="submit" class="btn">Change Password</button>
            </form>
        </div>
    </div>

</body>
</html>
