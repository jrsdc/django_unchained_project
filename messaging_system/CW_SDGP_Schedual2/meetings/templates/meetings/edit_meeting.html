{% extends 'meetings/base.html' %}
{% block title %}Edit Meeting – Sky{% endblock %}

{% block extra_styles %}
<style>
.edit-page {
    flex: 1;
    padding: 35px;
    overflow-y: auto;
    background: var(--sky-light-bg);
}

.edit-page .header {
    margin-bottom: 25px;
}

.edit-page .header h1 {
    margin-bottom: 5px;
}

.edit-page .header p {
    color: #777;
    margin-top: 0;
}

.edit-card {
    background: white;
    border-radius: 16px;
    padding: 28px;
    max-width: 700px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    border: 1px solid #eee;
    margin-bottom: 20px;
}

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.fg { margin-bottom: 16px; }

.fg label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 6px;
}

.fg input, .fg select, .fg textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: .2s;
}

.fg input:focus, .fg select:focus, .fg textarea:focus {
    border-color: var(--sky-purple);
    box-shadow: 0 0 0 3px rgba(157, 78, 221, 0.15);
}

.fg textarea { min-height: 80px; resize: vertical; }

.edit-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    max-width: 700px;
}
</style>
{% endblock %}

{% block content %}
<div class="edit-page">
    <div class="header">
        <h1>Edit Meeting</h1>
        <p>Update the details for this meeting.</p>
    </div>

    <div class="edit-card">
        <form method="post">
            {% csrf_token %}

            <div class="fg">
                <label>Title</label>
                <input type="text" name="title" value="{{ form.title.value }}" required>
            </div>

            <div class="form-row">
                <div class="fg">
                    <label>Type</label>
                    <select name="meeting_type">
                        {% for val, label in form.fields.meeting_type.choices %}
                            <option value="{{ val }}" {% if val == form.meeting_type.value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="fg">
                    <label>Date</label>
                    <input type="date" name="date" value="{{ form.date.value|date:'Y-m-d' }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="fg">
                    <label>Start Time</label>
                    <input type="time" name="start_time" value="{{ form.start_time.value }}" required>
                </div>
                <div class="fg">
                    <label>End Time</label>
                    <input type="time" name="end_time" value="{{ form.end_time.value }}" required>
                </div>
            </div>

            <div class="fg">
                <label>Location</label>
                <input type="text" name="location" value="{{ form.location.value|default:'' }}">
            </div>

            <div class="fg">
                <label>Description</label>
                <textarea name="description">{{ form.description.value|default:'' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>

    <div class="edit-actions">
        <a href="{% url 'delete_meeting' meeting.id %}" class="btn btn-danger" onclick="return confirm('Delete this meeting?')">🗑️ Delete Meeting</a>
        <a href="{% url 'schedule' %}" class="btn btn-ghost">← Back to Schedule</a>
    </div>
</div>
{% endblock %}
