{% extends 'organisation/base.html' %}

{% block content %}

<header style="padding: 35;">
<h1>Organisation Home</h1>
<p>All SKY organisation teams</p>
</header>

<div class="section" style="margin-top: 25px;">
    <h2>Teams</h2>
    {% for team in all_teams %}
    <div class ="team-row">
        <p><b>{{team.name}}</b></p>
        <span>{{team.department}} - Manager: {{team.manager}}</span>
    </div>
    {% empty %}
        <p>No teams available.</p>
    {% endfor %}

</div>

{% endblock %}
