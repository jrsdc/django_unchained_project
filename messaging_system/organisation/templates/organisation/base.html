<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Sky Schedule{% endblock %}</title>
<style>
  :root {
    --sky-purple: #9d4edd;
    --sky-purple-light: #fdf2ff;
    --sky-light-bg: #f8f9fc;
    --sky-border: #e0e0e0;
    --sky-text: #333;
    --sky-muted: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    height: 100vh;
    background: var(--sky-light-bg);
    color: var(--sky-text);
    overflow: hidden;
  }
  .main-nav {
    width: 200px; background: #fff;
    border-right: 1px solid var(--sky-border);
    display: flex; flex-direction: column;
    padding: 20px 10px; flex-shrink: 0; height: 100vh;
  }
  .logo-container { display: flex; align-items: center; gap: 12px; padding-left: 10px; margin-bottom: 30px; }
  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #9d4edd, #ff4d6d);
    border-radius: 10px; display: flex; align-items: center;
    justify-content: center; color: white; font-weight: 900; font-size: 22px;
    box-shadow: 0 4px 10px rgba(157,78,221,0.2);
  }
  .logo-text { font-size: 24px; font-weight: 800; color: var(--sky-purple); letter-spacing: -1px; }
  .main-nav-item {
    padding: 12px; text-decoration: none; color: var(--sky-muted);
    font-size: 14px; display: flex; align-items: center; gap: 10px;
    transition: 0.2s; font-weight: 600; margin-bottom: 4px; border-radius: 8px;
  }
  .main-nav-item:hover, .main-nav-item.active { color: var(--sky-purple); background: var(--sky-purple-light); }
  .sidebar-footer { margin-top: auto; padding-top: 20px; }
  .version-text { padding-left: 12px; font-size: 11px; color: #ccc; font-weight: 500; margin-top: 5px; }
  .page-content { flex: 1; overflow: hidden; display: flex; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 18px; border-radius: 10px; border: none;
    cursor: pointer; font-size: 13px; font-weight: 700;
    transition: 0.2s; text-decoration: none; font-family: inherit;
  }
  .btn-primary { background: linear-gradient(135deg, #9d4edd, #ff4d9d); color: #fff; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-ghost { background: transparent; color: var(--sky-muted); border: 1px solid var(--sky-border); }
  .btn-ghost:hover { background: var(--sky-light-bg); color: var(--sky-text); }
  .btn-danger { background: #fff0f0; color: #d9534f; border: 1px solid #f5c6c5; }
  .btn-danger:hover { background: #fde0df; }
</style>
{% block extra_styles %}{% endblock %}
</head>
<body>
<nav class="main-nav">
  <div class="logo-container">
    <div class="logo-icon">S</div>
    <span class="logo-text">sky</span>
  </div>
  <a href="/teams/dashboard/" class="main-nav-item">📊 Dashboard</a>
  <a href="/teams/" class="main-nav-item">👥 Teams</a>
  <a href="/organisation/departments/" class="main-nav-item" >🏢 Departments</a>
  <a href="/organisation/" class="main-nav-item " active>🏬 Organisation</a>
  <a href="/inbox/" class="main-nav-item">💬 Messages</a>
  <a href="/schedule/" class="main-nav-item">📅 Schedule</a>
  <a href="/teams/settings/" class="main-nav-item">⚙️ Settings</a>
  
  <div class="sidebar-footer">
    <a href="{% url 'logout' %}" class="main-nav-item" style="color:#d9534f;">🔓 Logout</a>
    <div class="version-text">v2026.1.0</div>
  </div>
</nav>
<div class="page-content" style="flex:1; overflow-y: auto;">
  {% block content %}{% endblock %}
</div>
{% block extra_scripts %}{% endblock %}
</body>
</html>
